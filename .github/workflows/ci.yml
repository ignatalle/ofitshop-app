name: Outfit Shop Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hay deuda de lint histórica en el repositorio. La seguimos ejecutando para
      # verla en logs, pero no bloquea producción hasta terminar esa limpieza.
      - name: Lint audit
        continue-on-error: true
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Financial invariants
        run: npm run test:finance

      - name: Build
        env:
          # El build evalúa el cliente de Supabase aunque no haga requests.
          # Usamos valores CI válidos de forma para no depender de secretos de producción.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
